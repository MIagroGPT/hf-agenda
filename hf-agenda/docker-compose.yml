version: "3.8"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hfagenda
      POSTGRES_USER: hfuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfuser -d hfagenda"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Next.js App ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hf-agenda
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://hfuser:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/hfagenda
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hf-network

volumes:
  postgres_data:
    driver: local

networks:
  hf-network:
    driver: bridge
